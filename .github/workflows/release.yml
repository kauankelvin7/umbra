name: Build and release Umbra PDF

on:
  push:
    branches: [main]
    paths:
      - "umbra.py"
      - "requirements.txt"
      - "packaging/**"
      - "build.ps1"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:
  create:

permissions:
  contents: write

concurrency:
  group: umbra-release
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content umbra.py -Raw
          $match = [regex]::Match($content, 'APP_VERSAO\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "APP_VERSAO not found in umbra.py" }
          $version = $match.Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Generate application icon
        shell: pwsh
        run: |
          python packaging/export_icon.py

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "Umbra PDF" `
            --icon "assets/umbra_pdf.ico" `
            --version-file "packaging/version_info.txt" `
            --collect-all fitz `
            --collect-all pymupdf `
            "umbra.py"

      - name: Package release assets
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $releaseDir = Join-Path $PWD "release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $exeZip = Join-Path $releaseDir "Umbra-PDF-v$version-windows-x64.zip"
          $sourceZip = Join-Path $releaseDir "Umbra-PDF-v$version-source.zip"

          $portable = Join-Path $PWD "portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item "dist/Umbra PDF.exe" $portable
          Copy-Item "README.md" $portable
          Copy-Item "CHANGELOG.md" $portable
          Compress-Archive -Path "$portable/*" -DestinationPath $exeZip -Force

          $source = Join-Path $PWD "source-package"
          New-Item -ItemType Directory -Force -Path $source | Out-Null
          Copy-Item "umbra.py", "README.md", "CHANGELOG.md", "requirements.txt", "build.ps1" $source
          Copy-Item "packaging" $source -Recurse
          Compress-Archive -Path "$source/*" -DestinationPath $sourceZip -Force

          Copy-Item "dist/Umbra PDF.exe" (Join-Path $releaseDir "Umbra-PDF-v$version-windows-x64.exe")

          $assets = Get-ChildItem $releaseDir -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" }
          $hashLines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 $asset.FullName).Hash.ToLower()
            "$hash  $($asset.Name)"
          }
          $hashLines | Set-Content -Encoding ascii (Join-Path $releaseDir "SHA256SUMS.txt")

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Umbra-PDF-${{ steps.version.outputs.version }}-windows-x64
          path: release/*
          if-no-files-found: error

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --target "$env:GITHUB_SHA" `
              --title "Umbra PDF v$version" `
              --notes "Primeira release pública do Umbra PDF. Processamento local de PDFs escaneados, presets persistentes, reprocessamento, visualizador com comparação e distribuição Windows x64. Consulte CHANGELOG.md para detalhes."
          }

          gh release upload $tag release/* --clobber
